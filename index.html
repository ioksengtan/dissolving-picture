<title>溶解畫模擬器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: workbench. Left = the cardboard frame with a pull tab you drag; right = controls and the cut sheet numbers read off the Reel's diagram. */
:root{
  --bg:#eceef2; --panel:#f8f9fb; --ink:#1c2130; --muted:#5b6275; --line:#cfd3dc;
  --accent:#6a3fa3; --accent-ink:#ffffff; --green:#7fb82f; --kraft:#b5562f; --kraft-dark:#7d3519; --tab:#f1c75a;
  --ok:#2f7d4f;
  --display:'Fredoka','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans TC',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13151c; --panel:#1b1e28; --ink:#eceef5; --muted:#9aa1b5; --line:#303545;
    --accent:#a98be0; --accent-ink:#17121f; --green:#9bd44a; --kraft:#c4673b; --kraft-dark:#8a3d1d; --tab:#e8b94a;
    --ok:#6fcf97; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13151c; --panel:#1b1e28; --ink:#eceef5; --muted:#9aa1b5; --line:#303545;
  --accent:#a98be0; --accent-ink:#17121f; --green:#9bd44a; --kraft:#c4673b; --kraft-dark:#8a3d1d; --tab:#e8b94a;
  --ok:#6fcf97; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:24px}
header h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:62ch}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:24px;align-items:start}
@media (max-width:760px){.bench{grid-template-columns:minmax(0,1fr)}}
.stagewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 12px 24px;display:grid;justify-items:center}
.stage{position:relative;width:min(100%,380px);padding-top:110px}
.tab{position:absolute;left:50%;top:88px;width:64px;height:130px;margin-left:-32px;background:var(--tab);
  border-radius:3px 3px 0 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.2);cursor:grab;touch-action:none;z-index:0;
  background-image:linear-gradient(90deg,rgba(255,255,255,.25),transparent 30%,transparent 70%,rgba(0,0,0,.08))}
.tab:active{cursor:grabbing}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tab span{position:absolute;top:8px;left:0;right:0;text-align:center;font:500 11px var(--mono);color:rgba(0,0,0,.55);letter-spacing:.06em}
.frame{position:relative;z-index:1;padding:46px 40px 44px;border-radius:2px;
  background:
   repeating-linear-gradient(180deg,rgba(255,220,180,.06) 0 2px,rgba(0,0,0,0) 2px 9px),
   linear-gradient(135deg,#4a2c1d,#3a2115 55%,#2b180f);
  box-shadow:0 0 0 2px rgba(0,0,0,.35),0 14px 24px -10px rgba(0,0,0,.45)}
.window{position:relative;background:#222;box-shadow:inset 0 0 0 3px rgba(0,0,0,.55),inset 0 4px 10px rgba(0,0,0,.5);padding:3px}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/10.5;background:#999}
.hint{margin:14px 0 0;font-size:13px;color:var(--muted);text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px}
.panel h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0}
.row{display:grid;gap:6px}
.row label,.lab{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.row output{font-family:var(--mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:10px 8px;font:500 14px var(--body);cursor:pointer;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px 14px;font:500 14px var(--body);cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.upl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.upl label{display:block;border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:13px;color:var(--muted);min-height:44px}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.upl label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.sheet{font:400 13px/1.7 var(--mono);color:var(--ink);background:var(--bg);border-radius:10px;padding:12px 14px;margin:0;display:grid;gap:2px}
.sheet b{font-weight:500;color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}
</style>

<div class="wrap">
  <header>
    <h1>溶解畫模擬器</h1>
    <p>拉動框上的黃色拉片，畫面會從圖 A 切成圖 B。這是外觀效果的模擬，不是紙條實際的力學模型。</p>
  </header>

  <div class="bench">
    <div class="stagewrap">
      <div class="stage" id="stage">
        <div class="tab" id="tab" role="slider" tabindex="0" aria-label="拉片" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span>PULL</span></div>
        <div class="frame">
          <div class="window"><canvas id="cv" width="480" height="630" aria-label="溶解畫的畫面"></canvas></div>
        </div>
      </div>
      <p class="hint">向上拖拉片，或用右邊的滑桿。鍵盤可用上下鍵。</p>
    </div>

    <aside class="panel">
      <h2>參數</h2>
      <div class="row">
        <label for="pull">拉片位置<output id="pullOut">0%</output></label>
        <input id="pull" type="range" min="0" max="100" value="0">
      </div>
      <div class="row">
        <label for="strips">條數<output id="stripsOut">7</output></label>
        <input id="strips" type="range" min="3" max="12" value="7">
      </div>
      <div class="row">
        <label for="stagger">條與條的時間差<output id="stagOut">0.6</output></label>
        <input id="stagger" type="range" min="0" max="15" value="6">
      </div>
      <div class="row">
        <span class="lab">換圖方式</span>
        <div class="seg" role="group" aria-label="換圖方式">
          <button id="mFlip" aria-pressed="true">平移</button>
          <button id="mWipe" aria-pressed="false">斜切擦入</button>
        </div>
      </div>
      <div class="btns">
        <button class="btn primary" id="demo">自動示範</button>
        <button class="btn" id="reset">回到起點</button>
      </div>
      <div class="row">
        <span class="lab">換成自己的圖（不會上傳）</span>
        <div class="upl">
          <label>圖 A<input id="fileA" type="file" accept="image/*"></label>
          <label>圖 B<input id="fileB" type="file" accept="image/*"></label>
        </div>
        <button class="btn" id="restore">還原範例圖</button>
      </div>
    </aside>
  </div>

  <section class="panel" aria-labelledby="sh">
    <h2 id="sh">切條尺寸</h2>
    <pre class="sheet" id="sheet"></pre>
    <p class="note">數字取自 Reel 的圖面（7 條、每條 1.5 cm、圖像區寬 8 cm、拉片至少 8 cm、2 張 A4）。其他條數是我用同樣的 1.5 cm 條高推算，沒有對照原圖驗證。</p>
  </section>
</div>

  var state={p:0,n:7,stag:0.6,mode:'flip',anim:null};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rng(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}

  function drawMonster(c,mood){
    var r=rng(mood==='calm'?7:11);
    c.fillStyle='#9fd64f';c.fillRect(0,0,W,H);
    c.lineWidth=3;
    for(var i=0;i<260;i++){
      var x=r()*W,y=r()*H;
      c.strokeStyle=r()>.5?'rgba(255,255,120,.35)':'rgba(60,140,30,.28)';
      c.beginPath();c.moveTo(x,y);c.lineTo(x+22,y-16);c.stroke();
    }
    if(mood==='happy'){
      c.strokeStyle='#e8892c';c.lineWidth=9;c.lineCap='round';
      [[-1],[1]].forEach(function(s){
        var d=s[0],x0=240+d*150,y0=420;
        c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(x0+d*70,y0-90,x0+d*55,y0-200);c.stroke();
        c.lineWidth=6;
        [-30,0,30].forEach(function(a){c.beginPath();c.moveTo(x0+d*55,y0-200);c.lineTo(x0+d*55+a*d*1.2+d*8,y0-200-48+Math.abs(a)*.4);c.stroke()});
        c.lineWidth=9;
      });
    }
    var cx=240,cy=345,rx=172,ry=200;
    c.fillStyle='#8a4fc2';c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);c.fill();
    for(var k=0;k<1400;k++){
      var a=r()*Math.PI*2,rad=Math.sqrt(r()),px=cx+Math.cos(a)*rx*rad,py=cy+Math.sin(a)*ry*rad;
      var edge=rad>.8;var len=edge?20:10;
      c.strokeStyle=edge?(r()>.5?'#5d2d93':'#a76ad8'):(r()>.5?'rgba(70,30,120,.55)':'rgba(190,140,240,.5)');
      c.lineWidth=2;c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(a)*len*.6+(r()-.5)*8,py+Math.sin(a)*len*.6-4);c.stroke();
    }
    c.strokeStyle='#e8892c';c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(212,196);c.quadraticCurveTo(245,178,282,196);c.stroke();
    c.fillStyle='#fff';c.strokeStyle='#1a1a1a';c.lineWidth=4;c.beginPath();c.ellipse(cx,285,56,52,0,0,Math.PI*2);c.fill();c.stroke();
    c.fillStyle='#3aa0d8';c.beginPath();c.arc(cx,288,28,0,Math.PI*2);c.fill();
    c.fillStyle='#0d1b2a';c.beginPath();c.arc(cx,288,14,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(cx-8,280,6,0,Math.PI*2);c.fill();
    c.strokeStyle='#1a1a1a';c.lineWidth=4;
    if(mood==='calm'){
      c.beginPath();c.moveTo(190,395);c.quadraticCurveTo(240,430,290,395);c.stroke();
      c.fillStyle='#fff';c.fillRect(222,398,18,22);c.fillRect(244,398,18,22);c.strokeRect(222,398,18,22);c.strokeRect(244,398,18,22);
    }else{
      c.fillStyle='#1a0a14';c.beginPath();c.ellipse(240,425,74,52,0,0,Math.PI*2);c.fill();
      c.fillStyle='#fff';c.fillRect(196,378,26,24);c.fillRect(230,378,26,24);c.fillRect(264,380,22,22);
      c.fillStyle='#d9323c';c.beginPath();c.ellipse(244,466,32,36,0,0,Math.PI*2);c.fill();
      c.strokeStyle='#8c1a22';c.lineWidth=3;c.beginPath();c.moveTo(244,446);c.lineTo(244,484);c.stroke();
    }
  }

  function coverDraw(c,img){
    c.fillStyle='#fff';c.fillRect(0,0,W,H);
    var s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
    c.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  }

  function defaults(){
    drawMonster(A.getContext('2d'),'calm');drawMonster(B.getContext('2d'),'happy');render();
    [[DOG_B,A],[DOG_A,B]].forEach(function(p){var im=new Image();im.onload=function(){coverDraw(p[1].getContext('2d'),im);render()};im.src=p[0]});
  }

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

  function render(){
    var n=state.n,s=state.stag,p=state.p,h=H/n;
    ctx.fillStyle='#222';ctx.fillRect(0,0,W,H);
    for(var i=0;i<n;i++){
      var y0=i*h,span=1+s;
      var q=clamp(p*span-s*(i/Math.max(1,n-1)),0,1);
      q=ease(q);
      ctx.save();
      ctx.beginPath();ctx.rect(0,y0,W,h);ctx.clip();
      if(state.mode==='flip'){
        var oy=q*h;
        ctx.drawImage(A,0,y0,W,h,0,y0-oy,W,h);
        ctx.drawImage(B,0,y0,W,h,0,y0+h-oy,W,h);
        if(q>0&&q<1){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,y0+h-oy-2,W,2)}
      }else{
        var sl=h*1.4,b=q*(W+sl);
        ctx.drawImage(A,0,y0,W,h,0,y0,W,h);
        if(q>0){
          ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(b,y0);ctx.lineTo(b-sl,y0+h);ctx.lineTo(0,y0+h);ctx.closePath();ctx.clip();
          ctx.drawImage(B,0,y0,W,h,0,y0,W,h);
        }
        ctx.restore();
        ctx.save();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;
        if(q>0&&q<1){ctx.beginPath();ctx.moveTo(b,y0);ctx.lineTo(b-sl,y0+h);ctx.stroke()}
      }
      ctx.restore();
      ctx.save();ctx.strokeStyle='rgba(20,20,20,.55)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,y0+h);ctx.lineTo(W,y0+h);ctx.stroke();ctx.restore();
    }
    var tab=document.getElementById('tab');
    tab.style.transform='translateY('+(-p*88)+'px)';
    var pct=Math.round(p*100);
    tab.setAttribute('aria-valuenow',pct);
    document.getElementById('pull').value=pct;
    document.getElementById('pullOut').textContent=pct+'%';
  }

  function setP(v){state.p=clamp(v,0,1);render()}

  /* drag the tab */
  var tab=document.getElementById('tab'),drag=null;
  tab.addEventListener('pointerdown',function(e){stopAnim();drag={y:e.clientY,p:state.p};tab.setPointerCapture(e.pointerId)});
  tab.addEventListener('pointermove',function(e){if(!drag)return;setP(drag.p+(drag.y-e.clientY)/88)});
  function end(){drag=null}
  tab.addEventListener('pointerup',end);tab.addEventListener('pointercancel',end);
  tab.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){setP(state.p+.05);e.preventDefault()}
    if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setP(state.p-.05);e.preventDefault()}
    if(e.key==='Home'){setP(0);e.preventDefault()}
    if(e.key==='End'){setP(1);e.preventDefault()}
  });

  document.getElementById('pull').addEventListener('input',function(e){stopAnim();setP(e.target.value/100)});
  document.getElementById('strips').addEventListener('input',function(e){
    state.n=+e.target.value;document.getElementById('stripsOut').textContent=state.n;sheet();render()});
  document.getElementById('stagger').addEventListener('input',function(e){
    state.stag=e.target.value/10;document.getElementById('stagOut').textContent=state.stag.toFixed(1);render()});

  function mode(m){
    state.mode=m;
    document.getElementById('mFlip').setAttribute('aria-pressed',m==='flip');
    document.getElementById('mWipe').setAttribute('aria-pressed',m==='wipe');
    render();
  }
  document.getElementById('mFlip').onclick=function(){mode('flip')};
  document.getElementById('mWipe').onclick=function(){mode('wipe')};

  function stopAnim(){if(state.anim){cancelAnimationFrame(state.anim);state.anim=null}}
  function animateTo(target,ms,done){
    stopAnim();
    if(reduce){setP(target);if(done)done();return}
    var from=state.p,t0=performance.now();
    (function step(t){
      var k=clamp((t-t0)/ms,0,1);
      setP(from+(target-from)*k);
      if(k<1)state.anim=requestAnimationFrame(step);else{state.anim=null;if(done)done()}
    })(t0);
  }
  document.getElementById('demo').onclick=function(){
    animateTo(state.p>.5?0:1,1600);
  };
  document.getElementById('reset').onclick=function(){stopAnim();setP(0)};

  function loadFile(input,target){
    input.addEventListener('change',function(){
      var f=input.files&&input.files[0];if(!f)return;
      var url=URL.createObjectURL(f),img=new Image();
      img.onload=function(){coverDraw(target.getContext('2d'),img);URL.revokeObjectURL(url);render()};
      img.src=url;
    });
  }
  loadFile(document.getElementById('fileA'),A);
  loadFile(document.getElementById('fileB'),B);
  document.getElementById('restore').onclick=function(){defaults();render()};

  function sheet(){
    var n=state.n,hcm=(n*1.5).toFixed(1).replace('.0','');
    document.getElementById('sheet').innerHTML=
      '圖像區　　<b>8 × '+hcm+' cm</b>（'+n+' 條 × 1.5 cm）\n'+
      '拉片行程　<b>≥ 8 cm</b>\n'+
      '用紙　　　<b>A4 × 2</b>（底座片＋移動片）\n'+
      '粗線＝裁切，切口只通過一個格子';
  }

  defaults();sheet();render();
})();
</script>
